# keck-etcs dry run on Nautilus (S4b, design 4.8.7): reduce 2022-04-09 in one
# pod with image 0.2.1 and gate it against the local S4 reference
# (s3://keck-etcs/mosfire/20220409/reference/): spec1d for both LDS749B traces
# and the four J0841 frames, wavelength RMS, zero point finite, median
# throughput 0.15-0.45, reference pin == the pod's PypeIt SHA, zero points to
# 1 percent and S2N to 5 percent. Same script block as night_job.yaml
# (nautilus/validate_manifests.py checks they are identical); differences:
# one row (nautilus/manifests/nights_dryrun.csv), backoffLimit 0, SPEC2D=1,
# GATES_REFERENCE set, 2 h deadline. Re-applying skips the night (its
# run_manifest.json is on the bucket); REPLACE=1 redoes it.
#
# Usage:
#   kubectl -n pypeit create configmap keck-etcs-nights-dryrun \
#     --from-file=nights.csv=nautilus/manifests/nights_dryrun.csv --dry-run=client -o yaml \
#     | kubectl apply -f -
#   kubectl -n pypeit delete job keck-etcs-validate --ignore-not-found
#   kubectl apply -f nautilus/validate_job.yaml
#   kubectl -n pypeit logs -f job/keck-etcs-validate         # GATES: PASS, NIGHT_DONE
apiVersion: batch/v1
kind: Job
metadata:
  name: keck-etcs-validate
  namespace: pypeit
  labels: {app: keck-etcs, role: validate}
spec:
  completionMode: Indexed
  completions: 1
  parallelism: 1
  backoffLimit: 0            # a one-shot validation: a failure must be looked at
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels: {app: keck-etcs, role: validate}
    spec:
      restartPolicy: Never
      containers:
      - name: validate
        # image 0.2.1, digest sha256:1a8e82918c8a517089cbdf87a6c2ea9cc06345c9c9d4e8a21ae081925ed3cce3 (keck-etcs 31488fa, PypeIt pin 8017f47)
        image: gitlab-registry.nrp-nautilus.io/profx/keck-etcs:0.2.1
        imagePullPolicy: Always
        env:
        - {name: HOME, value: /root}
        - {name: BUCKET, value: keck-etcs}
        - {name: KECK_ETCS_BUCKET, value: keck-etcs}
        - {name: ENDPOINT_URL, value: "http://rook-ceph-rgw-nautiluss3.rook"}
        - {name: KECK_ETCS_DATA, value: /scratch}
        - {name: KECK_ETCS_IMAGE, value: "gitlab-registry.nrp-nautilus.io/profx/keck-etcs:0.2.1"}
        - {name: KECK_ETCS_IMAGE_DIGEST, value: "sha256:1a8e82918c8a517089cbdf87a6c2ea9cc06345c9c9d4e8a21ae081925ed3cce3"}
        - {name: OMP_NUM_THREADS, value: "4"}
        - {name: SPEC2D, value: "1"}
        - {name: REPLACE, value: "0"}
        - {name: GATES_REFERENCE, value: "s3://keck-etcs/mosfire/20220409/reference"}
        - {name: MANIFEST, value: /opt/manifest/nights.csv}
        - name: JOB_NAME
          valueFrom: {fieldRef: {fieldPath: "metadata.labels['job-name']"}}
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        command: ["/bin/bash", "-lc"]
        args:
          - |
            set -o pipefail
            SRC=/opt/src/keck-etcs
            T0=$(date +%s)
            mkdir -p "$KECK_ETCS_DATA"
            exec > >(tee -a "$KECK_ETCS_DATA/pod.log") 2>&1
            log() { echo "=== $1 $(date -Is) ==="; }
            status() { python $SRC/nautilus/status_row.py --status "$1" --error "$2" --exit-code "$3" && python $SRC/scripts/nautilus/s3_sync.py push "runs/$JOB_NAME/status" --force; }
            fail() {
              log "FAILED [$1]: $2"
              echo "wall_clock_s=$(( $(date +%s) - T0 ))"
              if [ -n "${NIGHT_DIR:-}" ] && [ -f "$NIGHT_DIR/run_manifest.json" ]; then
                # push what exists, for diagnosis; the manifest's status is not success,
                # so the skip check of a later run retries this night
                python -c "import json, sys; p = sys.argv[1]; m = json.load(open(p)); m['status'] = sys.argv[2]; m['error'] = sys.argv[3]; open(p, 'w').write(json.dumps(m, indent=2) + '\n')" "$NIGHT_DIR/run_manifest.json" "$1" "$2"
                cp "$KECK_ETCS_DATA/pod.log" "$NIGHT_DIR/pod.log"
                python $SRC/scripts/nautilus/s3_sync.py push "$S3_PREFIX" --include 'redux/*' 'sens/*' 'harvest/*' run.log pod.log pypeit_pin_check.json gates.json run_manifest.json --force
              fi
              status "$1" "$2" "$3"
              exit 1
            }
            log PROVENANCE
            echo "image=$KECK_ETCS_IMAGE"
            echo "image_digest=$KECK_ETCS_IMAGE_DIGEST"
            echo "KECK_ETCS_GIT_SHAS=$KECK_ETCS_GIT_SHAS"
            python -c "import pypeit, keck_etcs; from keck_etcs import provenance; print('pypeit', pypeit.__version__, '| keck_etcs', keck_etcs.__version__, '|', provenance.git_shas())"
            echo "pin=$(cat $SRC/nautilus/pypeit_pin.txt)"
            echo "job=$JOB_NAME index=$JOB_COMPLETION_INDEX pod=$POD_NAME node=$NODE_NAME omp=$OMP_NUM_THREADS replace=$REPLACE spec2d=$SPEC2D"
            sha256sum "$MANIFEST"
            log NIGHT
            SPEC2D_ENV="$SPEC2D"
            eval "$(python -c "import csv, os, shlex; r = list(csv.DictReader(open(os.environ['MANIFEST'])))[int(os.environ['JOB_COMPLETION_INDEX'])]; print('\n'.join('export %s=%s' % (k.upper(), shlex.quote(v)) for k, v in r.items()))")"
            [ -n "${NIGHT:-}" ] || fail "setup failed" "no row $JOB_COMPLETION_INDEX in $MANIFEST" 11
            [ "$SPEC2D_ENV" = 1 ] && export SPEC2D=1
            NIGHT_DIR="$KECK_ETCS_DATA/$S3_PREFIX"
            FORCE=""; [ "$REPLACE" = 1 ] && FORCE="--force"
            echo "night=$NIGHT instrument=$INSTRUMENT s3_prefix=$S3_PREFIX standard=$STANDARD slit=$SLIT spec2d=$SPEC2D notes=$NOTES"
            log SKIP_CHECK
            # done = run_manifest.json on the bucket with status success and passed gates;
            # a night that failed (its manifest records the failure) is retried
            LS=$(python $SRC/scripts/nautilus/s3_sync.py ls "$S3_PREFIX") || fail "pull failed" "s3_sync.py ls $S3_PREFIX failed" 16
            if echo "$LS" | grep -q " $S3_PREFIX/run_manifest.json "; then
              python $SRC/scripts/nautilus/s3_sync.py pull "$S3_PREFIX" --include run_manifest.json > /dev/null || fail "pull failed" "run_manifest.json pull failed" 16
              PREV=$(python -c "import json, sys; m = json.load(open(sys.argv[1])); g = m.get('gates') or {}; print('done' if m.get('status') == 'success' and g.get('pass') else 'status=%s gates=%s' % (m.get('status'), g.get('failed')))" "$NIGHT_DIR/run_manifest.json")
              if [ "$PREV" = done ] && [ "$REPLACE" != 1 ]; then
                log "SKIP: $S3_PREFIX is done on the bucket (REPLACE=1 redoes the night)"
                status skipped "run_manifest.json records success" 0
                log NIGHT_DONE
                exit 0
              fi
              log "previous run: $PREV; REPLACE=$REPLACE: reducing"
              rm -f "$NIGHT_DIR/run_manifest.json"
            fi
            log REDUCE
            python $SRC/scripts/mosfire/reduce_standard.py "$NIGHT" --scratch "$KECK_ETCS_DATA" --s3-pull
            RC=$?
            if [ $RC -ne 0 ]; then
              case $RC in 10) S="no calibs";; 11) S="setup failed";; 13) S="no trace";; 14) S="sens failed";; 15) S="pin check failed";; 16) S="pull failed";; *) S="reduce failed";; esac
              fail "$S" "reduce_standard.py exit $RC" $RC
            fi
            log SENSFUNC
            python $SRC/scripts/mosfire/build_sensfunc.py "$NIGHT" --standard "$STANDARD" || fail "sens failed" "build_sensfunc.py failed" 14
            log GATES
            python $SRC/nautilus/gates.py "$NIGHT" --standard "$STANDARD" ${GATES_REFERENCE:+--reference "$GATES_REFERENCE"} --update-manifest --json "$NIGHT_DIR/gates.json" || fail "gate failed" "$(python -c "import json, sys; print('gates failed: ' + ','.join(json.load(open(sys.argv[1]))['failed']))" "$NIGHT_DIR/gates.json" 2>/dev/null)" 1
            log HARVEST
            if [ -f $SRC/scripts/mosfire/harvest_sens.py ]; then
              python $SRC/scripts/mosfire/harvest_sens.py harvest "$NIGHT" --standard "$STANDARD" || fail "sens failed" "harvest_sens.py failed" 14
            else
              echo "harvest_sens.py is not in this image (S6 not implemented yet): skipped"
            fi
            log MONITOR
            # calibration monitor (design 4.9): flags only, never fails the night (D47)
            python $SRC/scripts/mosfire/harvest_sens.py monitor "$NIGHT" || echo "WARNING: monitor step failed; night continues (D47)"
            [ "$SPEC2D" = 1 ] || rm -f "$NIGHT_DIR"/redux/Science/spec2d_*.fits
            log USAGE
            WALL=$(( $(date +%s) - T0 ))
            SCRATCH=$(du -sb "$KECK_ETCS_DATA" | cut -f1)
            MEMPEAK=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || cat /sys/fs/cgroup/memory/memory.max_usage_in_bytes 2>/dev/null || echo -1)
            echo "wall_clock_s=$WALL scratch_bytes=$SCRATCH memory_peak_bytes=$MEMPEAK"
            du -sh "$NIGHT_DIR"/* 2>/dev/null
            python -c "import json, sys; p = sys.argv[1]; m = json.load(open(p)); m['pod_usage'] = {'wall_clock_s': int(sys.argv[2]), 'scratch_bytes': int(sys.argv[3]), 'memory_peak_bytes': int(sys.argv[4])}; open(p, 'w').write(json.dumps(m, indent=2) + '\n')" "$NIGHT_DIR/run_manifest.json" "$WALL" "$SCRATCH" "$MEMPEAK"
            log PUSH
            cp "$KECK_ETCS_DATA/pod.log" "$NIGHT_DIR/pod.log"
            python $SRC/scripts/nautilus/s3_sync.py push "$S3_PREFIX" --include 'redux/*' 'sens/*' 'harvest/*' run.log pod.log pypeit_pin_check.json gates.json $FORCE || fail "push failed" "product push failed" 17
            python $SRC/scripts/nautilus/s3_sync.py push "$S3_PREFIX" --include run_manifest.json --force || fail "push failed" "run_manifest.json push failed" 17
            status success "" 0 || echo "WARNING: status row push failed"
            echo "wall_clock_s=$(( $(date +%s) - T0 ))"
            log NIGHT_DONE
        resources:
          requests: {cpu: "4", memory: "16Gi", ephemeral-storage: "30Gi"}
          limits: {cpu: "4", memory: "16Gi", ephemeral-storage: "60Gi"}
        volumeMounts:
        - {name: scratch, mountPath: /scratch}
        - {name: s3-credentials, mountPath: /root/.aws/credentials, subPath: credentials, readOnly: true}
        - {name: manifest, mountPath: /opt/manifest, readOnly: true}
      volumes:
      - {name: scratch, emptyDir: {}}
      - name: s3-credentials
        secret: {secretName: prp-s3-credentials}
      - name: manifest
        configMap: {name: keck-etcs-nights-dryrun}
