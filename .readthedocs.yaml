# Read the Docs configuration (plan S19/S22; docs/conf.py).
# The ETC installs without extras: numpy, scipy, astropy, jsonschema, pyyaml. No PypeIt.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
